[project]
name = "axion-modular"
version = "0.1.0"
description = "Modular, independently runnable reorganization of axion_ns (symbolic derivations, tables, checks)"
# axion_ns declares >=3.13; this layout was developed and tested on 3.12.3
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mpmath>=1.3",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
