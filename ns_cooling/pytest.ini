[pytest]
# Decision D-028: the tests are grouped by code area (one file per area) and run only when that part
# of the code changes, or on request. The slow ones are skipped unless -m slow is given.
markers =
    slow: slow validation (mesh convergence of the direct-Urca edge, 17 s); run with `make test-slow`
addopts = -m "not slow"
